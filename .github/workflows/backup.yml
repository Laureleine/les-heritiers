name: Sauvegarde Supabase quotidienne

on:
  schedule:
    - cron: '0 3 * * *'   # 3h UTC = 5h Paris (heure d'été)
  workflow_dispatch:        # déclenchement manuel possible

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Sauvegarde JSON (toutes les tables)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node scripts/backup_supabase.js
          echo "DATE=$(date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Sauvegarde Storage (buckets)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BACKUP_DATE: ${{ env.DATE }}
          STORAGE_OUT_DIR: ${{ github.workspace }}/storage/${{ env.DATE }}
        run: node scripts/backup_storage.js

      - name: Upload artefacts GitHub (rétention 30 jours)
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ env.DATE }}
          path: |
            backups/
            storage/
          retention-days: 30
          if-no-files-found: error
